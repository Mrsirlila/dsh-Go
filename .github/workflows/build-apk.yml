# Builds the arm64 release APK on demand (Actions → Build APK → Run workflow)
# and keeps it as a downloadable artifact. Nothing is published or released.
#
# The build scripts default to mainland-China mirrors; from a GitHub runner
# those are slow or unreachable, so this run points the same downloads at the
# official hosts. Every file is still checked against the sha256 / npm
# integrity pins in runtime/build-runtime.sh and the lockfiles.
#
# No signing key is configured here, so the APK is signed with the debug key:
# it installs fresh, but not over an APK signed with another key.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Bundled runtime (upstream = taken from ccch1mneyyy/dsh-Go's latest release APK)
        type: choice
        options: [upstream, build]
        default: upstream
      mirrors:
        description: Download sources (runtime=build only)
        type: choice
        options: [official, china]
        default: official

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  apk:
    name: arm64 release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The runtime does not depend on the app code. Rebuilding it needs every
      # pinned input to still be downloadable, and Termux drops old builds
      # (proot 5.1.107.98 is gone). So by default take the files the upstream
      # author shipped, after checking their manifest matches this tree's pins.
      - name: Reuse the runtime of the latest upstream release
        if: inputs.runtime == 'upstream'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r tag url < <(gh api 'repos/ccch1mneyyy/dsh-Go/releases?per_page=20' --jq '
            [.[] | select(.draft | not) | {tag: .tag_name, a: [.assets[] | select(.name | test("\\.apk$")) | select(.name | test("x64|x86") | not)]}
                 | select(.a | length > 0)][0] | "\(.tag) \(.a[0].browser_download_url)"')
          [[ -n ${url:-} ]] || { echo "no upstream release with an arm64 APK"; exit 1; }
          echo "upstream $tag: $url"
          tmp="$RUNNER_TEMP/upstream"; mkdir -p "$tmp"
          curl -fsSL --retry 3 -o "$tmp/up.apk" "$url"
          unzip -q "$tmp/up.apk" 'assets/runtime/*' 'lib/arm64-v8a/*' -d "$tmp/x"
          out=runtime/out/arm64-v8a
          mkdir -p "$out/assets" "$out/jniLibs/arm64-v8a"
          cp -r "$tmp/x/assets/runtime" "$out/assets/"
          for so in libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so; do
            cp "$tmp/x/lib/arm64-v8a/$so" "$out/jniLibs/arm64-v8a/"
          done
          python3 - "$out/assets/runtime/manifest.json" <<'PY'
          import json, re, sys
          m = json.load(open(sys.argv[1]))
          flat = json.dumps(m)
          src = open("runtime/build-runtime.sh").read()
          def pin(k):
              return re.search(r'^%s="(?:\$\{%s:-)?([^}"]+)' % (k, k), src, re.M).group(1)
          bridge = json.load(open("runtime/bridge/dsh-go-bridge/package.json"))["version"]
          want = {
              "runtime revision": pin("RUNTIME_REVISION") + "-dsh" + pin("DSH_VERSION") + "-node" + pin("NODE_VERSION") + "-ubuntu" + pin("UBUNTU_VERSION") + "-",
              "proot": '"prootVersion": "%s"' % pin("PROOT_VERSION"),
              "bridge": '"dshGoBridge": "%s"' % bridge,
          }
          bad = [k for k, v in want.items() if v not in flat]
          print("upstream runtime:", re.search(r'"runtimeVersion": "([^"]+)"', flat).group(1))
          if bad:
              sys.exit("upstream runtime does not match this tree (%s); run with runtime=build" % ", ".join(bad))
          print("matches this tree's pins")
          PY
          ls -la "$out/assets/runtime" "$out/jniLibs/arm64-v8a"

      - name: Use the official download hosts
        if: inputs.runtime == 'build' && inputs.mirrors == 'official'
        run: |
          sed -i \
            -e 's#^UBUNTU_MIRROR=.*#UBUNTU_MIRROR="https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release"#' \
            -e 's#^NODE_MIRROR=.*#NODE_MIRROR="https://nodejs.org/dist"#' \
            -e 's#^NPM_REGISTRY=.*#NPM_REGISTRY="https://registry.npmjs.org"#' \
            -e 's#^UBUNTU_ARCHIVE_AMD64=.*#UBUNTU_ARCHIVE_AMD64="http://archive.ubuntu.com/ubuntu"#' \
            -e 's#^UBUNTU_ARCHIVE_ARM64=.*#UBUNTU_ARCHIVE_ARM64="http://ports.ubuntu.com/ubuntu-ports"#' \
            runtime/build-runtime.sh
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-all.zip#' \
            app/android/gradle/wrapper/gradle-wrapper.properties
          {
            # Lockfiles resolve to npmmirror; fetch the same tarballs (same integrity) from npmjs.
            echo "npm_config_replace_registry_host=always"
            echo "DSH_MAVEN_MIRRORS=0"
          } >> "$GITHUB_ENV"
          git diff --stat

      # Termux's index only lists the newest build of each package, so a pinned
      # proot / libtalloc / libandroid-shmem can drop out of it. The script
      # accepts a cached .deb whose sha256 equals its pin; look for that exact
      # file in Termux's pool, then in the Internet Archive.
      - name: Fetch the pinned Termux packages
        if: inputs.runtime == 'build'
        run: |
          cache=runtime/.cache/termux
          mkdir -p "$cache"
          pin() { sed -nE "s/^  \[$1\]=([0-9a-f]{64})$/\1/p" runtime/build-runtime.sh; }
          ver() { sed -nE "s/^$1=\"([^\"]+)\".*/\1/p" runtime/build-runtime.sh; }
          for pkg in "proot:$(ver PROOT_VERSION)" "libtalloc:$(ver TALLOC_VERSION)" "libandroid-shmem:$(ver SHMEM_VERSION)"; do
            name="${pkg%%:*}_${pkg#*:}_aarch64.deb"
            want=$(pin "${name//./\\.}")
            [[ -n $want ]] || { echo "no pin for $name"; exit 1; }
            dir=${pkg:0:1}; [[ $pkg == lib* ]] && dir=${pkg:0:4}
            path="pool/main/$dir/${pkg%%:*}/$name"
            for url in \
              "https://packages.termux.dev/apt/termux-main/$path" \
              "https://web.archive.org/web/2026id_/https://packages.termux.dev/apt/termux-main/$path"; do
              if curl -fsSL --retry 2 -o "$cache/$name.part" "$url" &&
                [[ $(sha256sum "$cache/$name.part" | cut -d' ' -f1) == "$want" ]]; then
                mv "$cache/$name.part" "$cache/$name"; echo "✓ $name from $url"; break
              fi
              rm -f "$cache/$name.part"; echo "· $name not at $url"
            done
          done
          curl -fsSL https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages |
            awk -v RS= '/(^|\n)Package: (proot|libtalloc|libandroid-shmem)\n/' | grep -E '^(Package|Version):' || true

      - name: Build the bundled runtime (arm64-v8a)
        if: inputs.runtime == 'build'
        run: runtime/build-runtime.sh arm64-v8a

      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Build the APK
        run: tooling/build-apk.sh

      - name: Name the APK after its version
        id: apk
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' app/pubspec.yaml)
          name="dsh-go-${version}-${GITHUB_SHA::7}-arm64.apk"
          mv app/build/app/outputs/flutter-apk/app-arm64-release.apk "$RUNNER_TEMP/$name"
          sha256sum "$RUNNER_TEMP/$name" | tee "$RUNNER_TEMP/$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ runner.temp }}/${{ steps.apk.outputs.name }}
            ${{ runner.temp }}/${{ steps.apk.outputs.name }}.sha256
          retention-days: 14
          if-no-files-found: error
